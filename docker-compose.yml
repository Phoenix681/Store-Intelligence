version: '3.8'

services:
  api:
    build: .
    container_name: store_intelligence_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # This volume mapping ensures the SQLite database persists on your local machine
    # even if the container restarts or crashes.
    volumes:
      - ./store_intel.db:/usr/src/app/store_intel.db
    restart: unless-stopped